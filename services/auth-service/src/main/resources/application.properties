spring.application.name=auth-service
server.port=8081

# ─── MySQL datasource ────────────────────────────────────────────────────────
# spring.datasource.url=jdbc:mysql://localhost:3306/parkease_auth?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=password
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ─── Local H2 (development / unit tests) ─────────────────────────────────────
# Uncomment the block below and comment-out the MySQL block above to use H2.
spring.datasource.url=jdbc:h2:mem:parkease_auth;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─── JPA ─────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ─── Jackson ─────────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false

# ─── JWT ─────────────────────────────────────────────────────────────────────
# Secret must be >= 32 characters for HS256.
# IMPORTANT: Replace this with a secure random value in production!
jwt.secret=ParkEase@SecretKey#2024!ChangeInProd
# Token validity: 24 hours in milliseconds
jwt.expiry=86400000

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/


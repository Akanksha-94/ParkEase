spring.application.name=reservation-service
server.port=8083

spring.datasource.url=jdbc:h2:mem:reservationdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# External Service URLs (Mock)
parkease.services.parking-spot-service.url=http://localhost:8082/api/spots
parkease.services.parking-lot-service.url=http://localhost:8088/api/lots

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/


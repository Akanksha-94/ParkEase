spring:
  config:
    import: "optional:file:.env[.properties],optional:file:services/reservation-service/.env[.properties]"
  application:
    name: reservation-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:true}
  flyway:
    enabled: true
    baseline-on-migrate: true
    clean-disabled: false
    clean-on-validation-error: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  main:
    banner-mode: "off"

server:
  port: ${SERVER_PORT:8084}

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVER:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: false
    hostname: ${EUREKA_HOSTNAME:localhost}

parkease:
  services:
    parking-spot-service:
      url: ${PARKEASE_SPOTS_SERVICE_URL:http://parking-spot-service/spots}
    parking-lot-service:
      url: ${PARKEASE_LOTS_SERVICE_URL:http://parking-lot-service/lots}
  internal:
    gateway-secret: ${INTERNAL_GATEWAY_SECRET:ParkEaseGateway2024}

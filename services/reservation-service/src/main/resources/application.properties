spring.config.import=optional:file:.env[.properties],optional:file:services/reservation-service/.env[.properties]
spring.application.name=reservation-service
server.port=${SERVER_PORT:8084}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Eureka Discovery
eureka.client.serviceUrl.defaultZone=${EUREKA_SERVER:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=localhost

# JPA / Hibernate
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=false
spring.flyway.clean-on-validation-error=true

# Jackson - ISO-8601 dates
spring.jackson.serialization.write-dates-as-timestamps=false

# Error Handling
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
spring.main.banner-mode=off

# Inter-service URLs (via Eureka load-balanced names)
parkease.services.parking-spot-service.url=http://parking-spot-service/spots
parkease.services.parking-lot-service.url=http://parking-lot-service/lots
parkease.internal.gateway-secret=ParkEaseGateway2024

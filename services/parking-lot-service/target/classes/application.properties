spring.application.name=parking-lot-service
server.port=8082

# ─── MySQL datasource ────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/parkease_lots?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ─── Local H2 (development / unit tests) ─────────────────────────────────────
# Uncomment the block below and comment-out the MySQL block above to use H2.
# spring.datasource.url=jdbc:h2:mem:parkease_lots;DB_CLOSE_DELAY=-1
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# ─── JPA ─────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ─── Jackson ─────────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false

# ─── JWT (used for token validation in security filter) ──────────────────────
# IMPORTANT: Must match the secret used in auth-service!
jwt.secret=ParkEase@SecretKey#2024!ChangeInProd

# ─── OpenAPI / Swagger UI ─────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

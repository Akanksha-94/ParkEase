server:
  port: ${GATEWAY_PORT:8080}

spring:
  config:
    import: "optional:file:.env[.properties],optional:file:api-gateway/.env[.properties]"
  application:
    name: api-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    banner-mode: off
  cloud:
    gateway:
      httpclient:
        connect-timeout: 10000
        response-timeout: 30s
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173}
            allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
            allowed-headers: "*"
            allow-credentials: false
            max-age: 3600
      routes:
        # ── Auth Service Public (no token required) ─────────────────────────
        - id: auth-service-public
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/login, /api/v1/auth/register, /api/v1/auth/validate, /api/v1/auth/forgot-password, /api/v1/auth/reset-password
          filters:
            - StripPrefix=2
          metadata:
            response-timeout: 30000

        # ... (other routes)

        # ── Public Swagger Docs for all services ─────────────────────────
        - id: auth-swagger
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/v3/api-docs
          filters:
            - SetPath=/v3/api-docs

        - id: parking-lot-swagger
          uri: lb://parking-lot-service
          predicates:
            - Path=/api/v1/lots/v3/api-docs
          filters:
            - SetPath=/v3/api-docs

        - id: parking-spot-swagger
          uri: lb://parking-spot-service
          predicates:
            - Path=/api/v1/spots/v3/api-docs
          filters:
            - SetPath=/v3/api-docs

        - id: reservation-swagger
          uri: lb://reservation-service
          predicates:
            - Path=/api/v1/bookings/v3/api-docs
          filters:
            - SetPath=/v3/api-docs

        - id: payment-swagger
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/v3/api-docs
          filters:
            - SetPath=/v3/api-docs

        - id: report-swagger
          uri: lb://report-service
          predicates:
            - Path=/api/v1/analytics/v3/api-docs
          filters:
            - SetPath=/v3/api-docs

        - id: notification-swagger
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/v3/api-docs
          filters:
            - SetPath=/v3/api-docs

        - id: vehicle-swagger
          uri: lb://vehicle-service
          predicates:
            - Path=/api/v1/vehicles/v3/api-docs
          filters:
            - SetPath=/v3/api-docs

        # ── Auth Service Secured ─────────────────────────────────────────────
        - id: auth-service-secured
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: AuthenticationFilter
            - StripPrefix=2

        # ── Parking Lot Service ──────────────────────────────────────────────
        - id: parking-lot-service
          uri: lb://parking-lot-service
          predicates:
            - Path=/api/v1/lots/**
          filters:
            - name: AuthenticationFilter
            - StripPrefix=2

        # ── Parking Spot Service ─────────────────────────────────────────────
        - id: parking-spot-service
          uri: lb://parking-spot-service
          predicates:
            - Path=/api/v1/spots/**
          filters:
            - name: AuthenticationFilter
            - StripPrefix=2

        # ── Reservation Service ──────────────────────────────────────────────
        - id: reservation-service
          uri: lb://reservation-service
          predicates:
            - Path=/api/v1/bookings/**
          filters:
            - name: AuthenticationFilter
            - StripPrefix=2

        # ── Payment Service ──────────────────────────────────────────────────
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - name: AuthenticationFilter
            - StripPrefix=2

        # ── Report / Analytics Service ───────────────────────────────────────
        - id: report-service
          uri: lb://report-service
          predicates:
            - Path=/api/v1/analytics/**
          filters:
            - name: AuthenticationFilter
            - StripPrefix=2

        # ── Notification Service ─────────────────────────────────────────────
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - name: AuthenticationFilter
            - StripPrefix=2

        # ── Vehicle Service ──────────────────────────────────────────────────
        - id: vehicle-service
          uri: lb://vehicle-service
          predicates:
            - Path=/api/v1/vehicles/**
          filters:
            - name: AuthenticationFilter
            - StripPrefix=2

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVER:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: false
    hostname: localhost

jwt:
  secret: ${JWT_SECRET:4f6b6a6c6d6e6f707172737475767778797a3132333435363738393061626364}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.client: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: 01. Auth Service
        url: /api/v1/auth/v3/api-docs
      - name: 02. Parking Lot Service
        url: /api/v1/lots/v3/api-docs
      - name: 03. Parking Spot Service
        url: /api/v1/spots/v3/api-docs
      - name: 04. Reservation Service
        url: /api/v1/bookings/v3/api-docs
      - name: 05. Payment Service
        url: /api/v1/payments/v3/api-docs
      - name: 06. Vehicle Service
        url: /api/v1/vehicles/v3/api-docs
      - name: 07. Report Service
        url: /api/v1/analytics/v3/api-docs
      - name: 08. Notification Service
        url: /api/v1/notifications/v3/api-docs

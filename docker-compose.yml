  vehicle-service:
    build:
      context: ./services/vehicle-service
      dockerfile: Dockerfile
    container_name: vehicle-service
    ports:
      - "8088:8088"
    environment:
      SERVER_PORT: 8088
      SPRING_PROFILES_ACTIVE: dev
      EUREKA_SERVER: http://discovery-server:8761/eureka/
      EUREKA_HOSTNAME: vehicle-service
      LOCAL_DB_URL: jdbc:mysql://parkease-mysql:3306/parkease_vehicle_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      LOCAL_DB_USERNAME: root
      LOCAL_DB_PASSWORD: pallavi
      LOCAL_JPA_SHOW_SQL: "false"
    depends_on:
      parkease-mysql:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks:
      - parkease-network

# =========================================================================
# Shared Network & Volume Definitions
# =========================================================================
networks:
  parkease-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
